name: Bug report
description: Report a reproducible corebc.js problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include private keys, seed phrases, wallet passwords, or RPC credentials.
  - type: input
    id: version
    attributes:
      label: corebc version
      placeholder: 1.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and operating system
      description: Node.js or browser version, OS, and bundler if applicable.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Package format
      options: [ESM, CommonJS, Browser bundle]
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include runnable code, steps, network ID, and CIP number when relevant. Use disposable test keys only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
      description: Remove secrets and identifying information from logs.
    validations:
      required: true
