name: Feature request
description: Propose an improvement to corebc.js
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed API or behavior
      description: Include a TypeScript example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: cip
    attributes:
      label: Related CIP or implementation
      description: Link the specification or a compatible implementation.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and testing
      description: Describe effects on existing callers, Node.js, browsers, and expected tests.
